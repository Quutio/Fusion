name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        run: ./gradlew build
        env:
          GITHUB_USERNAME: "${{ github.actor }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Jars
          path: |
            fusion-api/build/libs/*.jar
            fusion-velocity/build/libs/*.jar
            fusion-velocity/fusion-velocity-api/build/libs/*.jar
          if-no-files-found: error
